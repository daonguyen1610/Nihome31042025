# Development overlay with a local mailbox. Running
#   docker compose -f docker-compose-dev.yaml up -d
# starts every service from docker-compose.yaml plus the non-relaying
# `smtpSink`, and re-points the backend email settings at it, so a browser run
# can click a real send without emailing a customer.
# Plain `docker compose up -d` keeps the configured mail server.
include:
  - docker-compose.yaml

services:
  nihomeBackend:
    depends_on:
      sqlserver:
        condition: service_healthy
      smtpSink:
        condition: service_started
    environment:
      EmailSettings__Host: smtpSink
      EmailSettings__Port: "1025"
      EmailSettings__UseSsl: "false"
      EmailSettings__UseStartTls: "false"
      EmailSettings__Username: e2e
      EmailSettings__Password: e2e-only
      EmailSettings__FromEmail: quotes@example.test

  smtpSink:
    image: node:22-bullseye-slim
    command: node /e2e/smtp-sink.mjs
    volumes:
      - ./nihomeweb/e2e/fixtures/smtp-sink.mjs:/e2e/smtp-sink.mjs:ro
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - nihome-network
    restart: unless-stopped
