# Local development and E2E overlay. It is not part of docker-compose.yaml and
# is never loaded automatically: pass it explicitly with
#   docker compose -f docker-compose.yaml -f docker-compose-dev.yaml up -d --build
# It replaces the backend SMTP settings with a non-relaying local mailbox so the
# browser-to-SMTP tests can click a real send without emailing a customer.
services:
  nihomeBackend:
    depends_on:
      smtpSink:
        condition: service_started
    environment:
      EmailSettings__Host: smtpSink
      EmailSettings__Port: "1025"
      EmailSettings__UseSsl: "false"
      EmailSettings__UseStartTls: "false"
      EmailSettings__Username: e2e
      EmailSettings__Password: e2e-only
      EmailSettings__FromEmail: quotes@example.test

  smtpSink:
    image: node:22-bullseye-slim
    command: node /e2e/smtp-sink.mjs
    volumes:
      - ./nihomeweb/e2e/fixtures/smtp-sink.mjs:/e2e/smtp-sink.mjs:ro
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - nihome-network
    restart: unless-stopped
