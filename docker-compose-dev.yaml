services:
  nihomeBackend:
    image: nihome31042025-backend-dev
    container_name: nihome31042025-backend-dev
    build:
      context: .
      dockerfile: ./nihomebackend/Dockerfile.dev
    stdin_open: true
    tty: true
    working_dir: /app
    # Remove artifacts left by the former mixed-case project name. NuGet imports
    # both files on Linux and otherwise emits duplicate MSB4011 warnings forever
    # because /app/obj is a persistent development volume.
    command: >-
      sh -c 'rm -f /app/obj/NihomeBackend.csproj.nuget.g.props
      /app/obj/NihomeBackend.csproj.nuget.g.targets &&
      exec dotnet watch --no-hot-reload --non-interactive run --urls=http://0.0.0.0:5043'
    ports:
      - "5044:5043"
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5043
      DOTNET_USE_POLLING_FILE_WATCHER: "${DOTNET_USE_POLLING_FILE_WATCHER:-0}"
      SkipNihomeWebBuild: "true"
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=NihomeDB;User Id=sa;Password=Nihome@31042025;TrustServerCertificate=True;
      DataProtection__KeysPath: /root/.aspnet/DataProtection-Keys
    volumes:
      - ./nihomebackend:/app
      - nihomebackend_bin:/app/bin
      - nihomebackend_obj:/app/obj
      - nuget_packages:/root/.nuget/packages
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    networks:
      - nihome-network

  nihomeWeb:
    image: node:22-bullseye-slim
    container_name: nihome31042025-web-dev
    working_dir: /app
    command: >-
      sh -c 'if [ ! -f node_modules/.package-lock.json ] ||
      [ package-lock.json -nt node_modules/.package-lock.json ]; then npm ci; fi &&
      exec npm run dev -- --host 0.0.0.0 --port 5043'
    ports:
      - "5043:5043"
    restart: unless-stopped
    depends_on:
      nihomeBackend:
        condition: service_started
    environment:
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-false}"
      VITE_API_PROXY_TARGET: http://nihomeBackend:5043
    volumes:
      - ./nihomeweb:/app
      - ./nihomebackend:/nihomebackend:ro
      - nihomeweb_node_modules:/app/node_modules
    networks:
      - nihome-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: nihome31042025-sqlserver
    environment:
      SA_PASSWORD: "Nihome@31042025"
      ACCEPT_EULA: "Y"
      MSSQL_MEMORY_LIMIT_MB: "1024"
    ports:
      - "1433:1433"
    restart: unless-stopped
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - nihome-network
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  nihomeweb_node_modules:
  nihomebackend_bin:
  nihomebackend_obj:
  nuget_packages:
  data_protection_keys:
  sqlserver_data:

networks:
  nihome-network:
    driver: bridge
