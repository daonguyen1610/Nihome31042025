services:
  nihomeBackend:
    image: nihome31042025-backend
    container_name: nihome31042025-backend
    build:
      context: .
      dockerfile: ./nihomebackend/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-local}
    ports:
      - "5043:5043"
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://0.0.0.0:5043
      Frontend__PublicBaseUrl: ${FRONTEND_PUBLIC_BASE_URL:-}
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=NihomeDB;User Id=sa;Password=Nihome@31042025;TrustServerCertificate=True;
      DataProtection__KeysPath: /root/.aspnet/DataProtection-Keys
    volumes:
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
      - work_task_files:/app/wwwroot/files/business-documents/work-tasks
    networks:
      - nihome-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: nihome31042025-sqlserver
    environment:
      SA_PASSWORD: "Nihome@31042025"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    restart: unless-stopped
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - nihome-network
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  data_protection_keys:
  work_task_files:
  sqlserver_data:

networks:
  nihome-network:
    driver: bridge
